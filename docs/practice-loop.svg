<svg xmlns="http://www.w3.org/2000/svg" width="960" height="548" viewBox="0 0 960 548" role="img" aria-labelledby="t d"><title id="t">The practice loop</title><desc id="d">ChatGPT reads progress, opens a session, runs the conversation and saves corrections, new words, rubric scores and checked exercises. You see it on /progress and review on /cards the next day. Self-marks (reviews) and checked answers (exercises) are stored apart and shown side by side.</desc><style>
