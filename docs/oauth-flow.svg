<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1148" viewBox="0 0 960 1148" role="img" aria-labelledby="t d"><title id="t">How an assistant connects</title><desc id="d">Sequence: the assistant gets 401 from /mcp, discovers the auth server through RFC 9728 and RFC 8414 metadata, registers itself, sends you through sign-in and consent with PKCE, exchanges the code for a JWT bound to /mcp, then calls tools; /mcp checks the token and the live consent row on every call.</desc><style>
