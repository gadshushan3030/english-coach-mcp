:11px">/mcp</text><rect x="520" y="24" width="176" height="70" rx="12" class="f-blue" stroke-width="1.5"/><g transform="translate(534 35)" class="k-blue" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="8" cy="15" r="4.5"/><path d="M11.2 11.8 20 3M16.5 6.5l2.5 2.5M14 9l2 2"/></g><text x="566" y="53" class="t">Better Auth</text><text x="566" y="73" class="mono xs" style="font-size:11px">/api/auth/*</text><rect x="748" y="24" width="176" height="70" rx="12" class="f-gray" stroke-width="1.5"/><g transform="translate(762 35)" class="k-gray" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></g><text x="794" y="53" class="t">You</text><text x="794" y="73" class="xs">in the browser</text><path d="M127 162 H367" class="k-purple" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/><text x="248" y="154" text-anchor="middle" class="mono" style="font-size:12px">POST /mcp  (no token)</text><path d="M369 200 H129" class="k-red dash" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><text x="248" y="192" text-anchor="middle" class="mono" style="font-size:12px">401 Unauthorized</text><text x="248" y="217" text-anchor="middle" class="mono xs" style="font-size:11px">WWW-Authenticate: resource_metadata</text><path d="M127 250 H601" class="k-purple" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/><text x="365" y="242" text-anchor="middle" class="mono" style="font-size:12px">GET /.well-known/oauth-protected-resource/mcp</text><path d="M603 288 H129" class="k-blue dash" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><text x="365" y="280" text-anchor="middle" class="mono" style="font-size:12px">authorization server: &lt;url&gt;/api/auth</text><path d="M127 326 H601" class="k-purple" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/><text x="365" y="318" text-anchor="middle" class="mono" style="font-size:12px">GET /.well-known/oauth-authorization-server/api/auth</text><path d="M603 364 H129" class="k-blue dash" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><text x="365" y="356" text-anchor="middle" class="" style="font-size:12.5px">register · authorize · token endpoints</text><path d="M127 444 H601" class="k-purple" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/><text x="365" y="436" text-anchor="middle" class="mono" style="font-size:12px">POST /oauth2/register  { redirect_uris }</text><path d="M603 482 H129" class="k-blue dash" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><text x="365" y="474" text-anchor="middle" class="mono" style="font-size:12px">client_id</text><path d="M127 562 H829" class="k-purple" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/><text x="479" y="554" text-anchor="middle" class="mono" style="font-size:12px">open /oauth2/authorize  code_challenge · resource=/mcp</text><path d="M831 600 H615" class="k-gray" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-gray)"/><text x="722" y="592" text-anchor="middle" class="" style="font-size:12.5px">sign in</text><text x="722" y="617" text-anchor="middle" class="mono xs" style="font-size:11px">/login</text><path d="M831 650 H615" class="k-gray" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-gray)"/><text x="722" y="642" text-anchor="middle" class="" style="font-size:12.5px">Allow</text><text x="722" y="667" text-anchor="middle" class="mono xs" style="font-size:11px">/oauth/consent</text><rect x="510" y="686" width="196" height="33" rx="9" class="f-orange" stroke-width="1.25"/><text x="524" y="705" class="c-orange" style="font-size:12.5px;font-weight:600">consent row saved</text><path d="M603 747 H129" class="k-blue dash" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><text x="365" y="739" text-anchor="middle" class="mono" style="font-size:12px">redirect → callback  ?code=…&amp;iss=…</text><path d="M127 827 H601" class="k-purple" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/><text x="365" y="819" text-anchor="middle" class="mono" style="font-size:12px">POST /oauth2/token  code_verifier · resource=/mcp</text><path d="M603 865 H129" class="k-blue dash" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><text x="365" y="857" text-anchor="middle" class="mono" style="font-size:12px">access JWT (aud = /mcp, 1 h) + refresh token</text><path d="M127 945 H367" class="k-purple" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/><text x="248" y="937" text-anchor="middle" class="mono" style="font-size:12px">POST /mcp</text><text x="248" y="962" text-anchor="middle" class="mono xs" style="font-size:11px">Authorization: Bearer &lt;JWT&gt;</text><rect x="249" y="981" width="250" height="71" rx="9" class="f-gray" stroke-width="1.25"/><text x="263" y="1000" class="c-purple" style="font-size:12.5px;font-weight:600">✓ signature · iss · aud · exp</text><text x="263" y="1019" class="c-orange" style="font-size:12.5px;font-weight:600">✓ consent row still there</text><text x="263" y="1038" class="c-green" style="font-size:12.5px;font-weight:600">→ tools run as that user</text><path d="M369 1080 H129" class="k-purple dash" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/><text x="248" y="1072" text-anchor="middle" class="" style="font-size:12.5px">tool result</text></svg>
